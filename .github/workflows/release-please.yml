name: Release Please

# Releases bump the patch version, features included, and bump the minor version when they
# contain a breaking change. release-please has no such setting for versions from 1.0, so there
# are two configs that differ only in "versioning": release-please-config.json always bumps the
# patch version, release-please-config.breaking.json always bumps the minor version. Upgrade
# notes in breaking-changes/ stay on main until a release bundles them, and the breaking-changes
# workflow requires one for every "!" pull request, so the breaking config is used while any
# note is on main.
#
# Whenever release-please opens or updates its pull request, the prepare job moves the upgrade
# notes into an "Upgrade guide" section of the new version in CHANGELOG.md and deletes the files
# on the release branch. Once the release is created, the release-notes job copies that version's
# CHANGELOG.md section, upgrade guide included, into the GitHub release.

on:
  push:
    branches:
      - main

concurrency:
  group: release-please

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare or publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Choose the version bump
        id: bump
        run: |
          if [ "$(node scripts/breaking-changes.mjs pending)" = true ]; then
            echo 'Unreleased breaking changes found, bumping the minor version.'
            echo 'config-file=release-please-config.breaking.json' >> "$GITHUB_OUTPUT"
          else
            echo 'No unreleased breaking changes, bumping the patch version.'
            echo 'config-file=release-please-config.json' >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: ${{ steps.bump.outputs.config-file }}

  prepare:
    name: Bundle breaking changes into the release pull request
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Runs again on every rewrite of the release branch; once the notes are moved there is
      # nothing left to bundle until the next release.
      - name: Bundle breaking changes into the changelog
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          node scripts/breaking-changes.mjs bundle
          git add --all CHANGELOG.md breaking-changes

          if git diff --cached --quiet; then
            echo 'No breaking changes to bundle.'
          else
            git commit --message 'docs: bundle breaking changes into the changelog'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

  # release-please writes the GitHub release from commit messages, so it lacks the upgrade
  # guide that the prepare job bundled into CHANGELOG.md. Replace the notes with the changelog
  # section of the released version.
  release-notes:
    name: Add the upgrade guide to the GitHub release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          node scripts/breaking-changes.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
